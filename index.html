<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCS eTMS</title>

    <meta name="theme-color" content="#2C125B">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* FULL SCREEN APP */
        .phone-screen {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        /* FULL IMAGE FIT */
      .screenshot {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("./exact.jpeg");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}
        /* CLICK AREAS (unchanged logic) */
        .overlay-btn {
            position: absolute;
            z-index: 2;
            border-radius: 50px;
        }

        .btn-bus {
            top: 25%;
            left: 5%;
            width: 90%;
            height: 86px;
        }

        .btn-cab {
            top: 40%;
            left: 5%;
            width: 90%;
            height: 86px;
        }

        .btn-geocode {
            top: 55%;
            left: 5%;
            width: 90%;
            height: 86px;
        }
    </style>
</head>

<body>

    <div class="phone-screen">
        <div class="screenshot"></div>

        <div class="overlay-btn btn-bus" onclick="window.location.href='home.html'"></div>
        <div class="overlay-btn btn-cab" onclick="window.location.href='home.html'"></div>
        <div class="overlay-btn btn-geocode" onclick="window.location.href='home.html'"></div>
    </div>

</body>
</html>
