<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Bus Pass</title>
  <meta name="theme-color" content="#2C125B">
  <link rel="manifest" href="/manifest.json">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #f0f0f0;
      font-family: 'Inter', sans-serif;
    }

    .app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      margin: 0 auto;
      background: #f2f2f7;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER - starts from very top */
    .header {
      background: #2C125B;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 14px;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 30px;
    }
    .hamburger {
      background: none; border: none; color: #fff;
      cursor: pointer; padding: 2px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .hamburger span {
      display: block;
      width: 20px; height: 2px;
      background: #fff;
      border-radius: 2px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }
    .bell-btn {
      background: none; border: none; color: #fff;
      cursor: pointer; padding: 2px;
    }
    .bell-icon { width: 22px; height: 22px; }

    /* ROUTE CARD */
    .route-card {
      margin: 14px 14px 10px;
      background: linear-gradient(135deg, #3a6fd8 0%, #6b3fa0 100%);
      border-radius: 14px;
      padding: 20px 20px 18px;
      color: #fff;
      flex-shrink: 0;
    }
    .route-top { font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 10px; }
    .route-arrow { text-align: center; font-size: 22px; margin-bottom: 10px; }
    .route-bottom { font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 14px; }
    .route-times {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.95);
    }

    /* SCROLLABLE MIDDLE - everything below header+route scrolls */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 14px 14px;
      -webkit-overflow-scrolling: touch;
      
    }
    .scroll-area::-webkit-scrollbar { display: none; }

    /* PASS CARD */
    .pass-card {
      background: #fff;
      border-radius: 0px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .pass-header {
      display: flex;
      align-items: center;
      position: relative;
      min-height: 60px;
    }
    .green-curl {
      position: absolute;
      top: 0; left: 0;
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      z-index: 1;
    }
    .pass-title {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a2e;
      text-align: center;
      flex: 1;
      padding: 16px 10px;
      position: relative;
      z-index: 1;
    }
    .pass-divider {
      border: none;
      border-top: 2px dashed #d0d0d0;
      margin: 0 16px;
    }

    /* doubled white space: 120px top and bottom */
    .qr-top-space { height: 105px; }
    .qr-bottom-space { height: 105px; }

    .qr-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
    }
    .qr-img {
      width: 100%;
      max-width: 370px;
      height: 370px;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      object-fit: cover;
      font-size: 13px;
      border-radius: 4px;
      overflow: hidden;
    }
    .qr-img img {
      width: 100%; height: 100%; object-fit: cover;
    }

    /* VIEW DETAILS inside scroll */
    .view-btn-wrap {
      padding: 14px 0 0;
    }
    .view-btn {
      width: 100%;
      background: #2C125B;
      color: #fff;
      border: none;
      border-radius: 0;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    .view-btn:active { opacity: 0.85; }

    /* TCS FOOTER - fixed at bottom */
    .tcs-footer {
      flex-shrink: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 20px 16px;
      border-top: 1px solid #ececec;
    }
    .tcs-logo-text {
      font-size: 30px;
      font-weight: 900;
      color: #000;
      letter-spacing: -1px;
      font-style: italic;
    }
    .tcs-divider-v { width: 1px; height: 28px; background: #999; }
    .tcs-company {
      font-size: 9px;
      font-weight: 900;
      color: #000;
      line-height: 1.4;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- HEADER - no status bar, starts from top -->
    <div class="header">
      <div class="header-left">
        <button class="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <span class="header-title">Digital Bus Pass</span>
      </div>
      <button class="bell-btn" aria-label="Notifications">
        <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          <line x1="12" y1="2" x2="12" y2="3"/>
        </svg>
      </button>
    </div>

    <!-- ROUTE CARD (fixed, not scrolling) -->
    <div class="route-card">
      <div class="route-top">Suraj Water Park</div>
      <div class="route-arrow">&#8644;</div>
      <div class="route-bottom">Kensington</div>
      <div class="route-times">
        <span>Office In - 07:30</span>
        <span>Office Out - 18:55</span>
      </div>
    </div>

    <!-- SCROLLABLE SECTION -->
    <div class="scroll-area">

      <div class="pass-card">
        <div class="pass-header">
          <!-- Triangle with inward-curved hypotenuse in top-left corner -->
          <svg class="green-curl" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,0 L60,0 Q20,20 0,60 Z" fill="#4caf50"/>
          </svg>
          <div class="pass-title">Confirmed Bus Pass</div>
        </div>
        <hr class="pass-divider">
        <div class="qr-top-space"></div>
        <div class="qr-wrapper">
          <div class="qr-img">
            <img src="Gemini_Generated_Image_h7igioh7igioh7ig.png" alt="QR Code"
              onerror="this.style.display='none';this.parentNode.innerHTML='[ QR Code Image ]'">
          </div>
        </div>
        <div class="qr-bottom-space"></div>
      </div>

      <!-- VIEW DETAILS inside scroll -->
      <div class="view-btn-wrap">
        <button class="view-btn">View Details</button>
      </div>

    </div>
    <!-- END SCROLL AREA -->

    <!-- TCS FOOTER always at bottom -->
    <div class="tcs-footer">
      <span class="tcs-logo-text">tcs</span>
      <div class="tcs-divider-v"></div>
      <div class="tcs-company">TATA<br>CONSULTANCY<br>SERVICES</div>
    </div>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
