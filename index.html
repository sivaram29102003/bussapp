<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCS eTMS</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2C125B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" href="/manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background: #111827;
        }
        
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Full screen container - matches screenshot size */
        .fullscreen-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile */
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #2563eb 0%, #6d28d9 45%, #4c1d95 100%);
        }
        
        /* Screenshot image - replace 'exact.jpeg' with your image path */
        .screenshot {
            width: 100%;
            height: 100%;
            background: url('exact.jpeg') no-repeat center center;
            background-size: contain; /* or 'cover' if you want to fill completely */
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Clickable overlay buttons - positioned based on screenshot */
        .overlay-btn {
            position: absolute;
            border-radius: 50px;
            transition: all 0.15s ease;
            z-index: 3;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        
        .overlay-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.05);
        }
        
        /* Button positions - adjust these percentages based on your screenshot */
        .btn-bus {
            top: 25%;
            left: 5%;
            width: 90%;
            height: 12%;
        }
        
        .btn-cab {
            top: 40%;
            left: 5%;
            width: 90%;
            height: 12%;
        }
        
        .btn-geocode {
            top: 55%;
            left: 5%;
            width: 90%;
            height: 12%;
        }

        /* For landscape orientation */
        @media (orientation: landscape) {
            .screenshot {
                background-size: contain;
                background-position: center center;
            }
        }

        /* For very small screens */
        @media (max-width: 400px) {
            .btn-bus { top: 22%; height: 13%; }
            .btn-cab { top: 38%; height: 13%; }
            .btn-geocode { top: 54%; height: 13%; }
        }

        /* For tablets and larger screens */
        @media (min-width: 768px) {
            .fullscreen-container {
                max-width: 500px;
                max-height: 900px;
                border-radius: 20px;
                box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
            }
        }
    </style>
</head>
<body>
    <div class="fullscreen-container">
        <!-- Screenshot image -->
        <div class="screenshot"></div>
        
        <!-- Clickable overlay buttons -->
        <div class="overlay-btn btn-bus" onclick="selectService('Bus Services')"></div>
        <div class="overlay-btn btn-cab" onclick="selectService('Cab Services')"></div>
        <div class="overlay-btn btn-geocode" onclick="selectService('Geocode Yourself')"></div>
    </div>

    <script>
        function selectService(service) {
            // Visual feedback
            const btns = document.querySelectorAll('.overlay-btn');
            btns.forEach(btn => {
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => { btn.style.transform = ''; }, 150);
            });
            
            alert(`✅ ${service} selected!`);
            // Uncomment below to navigate
            // window.location.href = 'home.html';
        }

        // Prevent scrolling
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('wheel', function(e) {
            e.preventDefault();
        }, { passive: false });

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
