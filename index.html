<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCS eTMS</title>
    
    <!-- PWA Meta Tags (Added) -->
    <meta name="theme-color" content="#3D4CED">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" href="/manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
          
        }
        
    
        
     
        .phone-screen {
            width: 100%;
            height: 100%;
            background: #2854b4;
            position: relative;
        }
        

        html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;        /* ← stops ALL scrolling */
    background: #6437C8;    /* ← matches screenshot background */
}

.phone-container {
    width: 100%;
    height: 100%;            /* ← fills full screen */
    max-width: 430px;        /* ← caps on larger screens */
    position: relative;
}
    .screenshot {
    position: absolute;
    inset: 0;
    background: url('exact.jpeg') no-repeat center top;  /* ← 'top' instead of 'center' */
    background-size: cover;
}
  
        
        /* Bottom white bar */
     
        
        /* Clickable overlay buttons */
        .overlay-btn {
            position: absolute;
            border-radius: 50px;
            transition: all 0.15s ease;
            z-index: 3;
        }
        
        .overlay-btn:active {
            background: none;
        }
        
        .btn-bus {
            top: 25%;
            left: 10%;
            width: 89%;
            height: 86px;
        }
        
        .btn-cab {
            top: 40%;
            left: 10%;
            width: 89%;
            height: 86px;
        }
        
        .btn-geocode {
            top: 55%;
            left: 10%;
            width: 89%;
            height: 86px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="phone-screen">
            <!-- Top fill -->

            
            <!-- Screenshot -->
            <div class="screenshot"></div>
            
           
            
            <!-- Clickable Areas -->
            <div class="overlay-btn btn-bus" onclick="window.location.href='home.html'"></div>
            <div class="overlay-btn btn-cab" onclick="window.location.href='home.html'"></div>
            <div class="overlay-btn btn-geocode" onclick="window.location.href='home.html'"></div>
        </div>
    </div>

    <script>
        function selectService(service) {
            alert(`✅ ${service} selected!`);
        }

        // PWA Service Worker (Added)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
