<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCS eTMS</title>

    <meta name="theme-color" content="#2C125B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" href="/manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* ❌ REMOVED phone-container */

        .phone-screen {
            width: 360px;
            height: 720px;
            position: relative;
            background: linear-gradient(180deg, #2563eb 0%, #6d28d9 45%, #4c1d95 100%);
            overflow: hidden;
        }

        .screenshot {
            width: 100%;
            height: 100%;
            background: url('exact.jpeg') no-repeat center top;
            background-size: cover;
            position: absolute;
            top: 30px;
            left: 0;
            z-index: 1;
        }

        .top-fill {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30px;
            background-color: #592bff;
            z-index: 2;
        }

        .bottom-white {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 34px;
            background: #f8fafc;
            z-index: 2;
        }

        .overlay-btn {
            position: absolute;
            border-radius: 50px;
            z-index: 3;
        }

        .btn-bus {
            top: 25%;
            left: 10%;
            width: 89%;
            height: 86px;
        }

        .btn-cab {
            top: 40%;
            left: 10%;
            width: 89%;
            height: 86px;
        }

        .btn-geocode {
            top: 55%;
            left: 10%;
            width: 89%;
            height: 86px;
        }
    </style>
</head>

<body>

    <!-- ONLY wrapper kept -->
    <div class="phone-screen">
        <div class="top-fill"></div>
        <div class="screenshot"></div>
        <div class="bottom-white"></div>

        <div class="overlay-btn btn-bus" onclick="window.location.href='home.html'"></div>
        <div class="overlay-btn btn-cab" onclick="window.location.href='home.html'"></div>
        <div class="overlay-btn btn-geocode" onclick="window.location.href='home.html'"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>

</body>
</html>
