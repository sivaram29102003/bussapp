<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCS eTMS</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2C125B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" href="/manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background: #111827;
        }
        
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Full screen container - fits real phone screen */
        .phone-screen {
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* For mobile dynamic viewport */
            background: linear-gradient(180deg, #2563eb 0%, #6d28d9 45%, #4c1d95 100%);
            position: relative;
            overflow: hidden;
        }
        
        /* Screenshot - fits exactly like real phone */
        .screenshot {
            width: 100%;
            height: 100%;
            background: url('exact.jpeg') no-repeat center center;
            background-size: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Clickable overlay buttons - positioned on top of screenshot */
        .overlay-btn {
            position: absolute;
            border-radius: 50px;
            transition: all 0.15s ease;
            z-index: 3;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        
        .overlay-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.08);
        }
        
        /* Button positions - optimized for Oppo K14x (1080x2400) */
        .btn-bus {
            top: 25%;
            left: 5%;
            width: 90%;
            height: 11%;
        }
        
        .btn-cab {
            top: 40%;
            left: 5%;
            width: 90%;
            height: 11%;
        }
        
        .btn-geocode {
            top: 55%;
            left: 5%;
            width: 90%;
            height: 11%;
        }

        /* Extra small screens */
        @media (max-width: 360px) {
            .btn-bus { top: 23%; height: 12%; }
            .btn-cab { top: 38%; height: 12%; }
            .btn-geocode { top: 53%; height: 12%; }
        }

        /* Large screens / tablets */
        @media (min-width: 768px) {
            .phone-screen {
                max-width: 500px;
                max-height: 900px;
                border-radius: 20px;
                box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
            }
        }

        /* Landscape mode */
        @media (orientation: landscape) and (max-height: 500px) {
            .btn-bus { top: 22%; height: 14%; }
            .btn-cab { top: 38%; height: 14%; }
            .btn-geocode { top: 54%; height: 14%; }
        }
    </style>
</head>
<body>
    <div class="phone-screen">
        <!-- Screenshot image -->
        <div class="screenshot"></div>
        
        <!-- Clickable Areas - positioned over the buttons in screenshot -->
        <div class="overlay-btn btn-bus" onclick="window.location.href='home.html'"></div>
        <div class="overlay-btn btn-cab" onclick="window.location.href='home.html'"></div>
        <div class="overlay-btn btn-geocode" onclick="window.location.href='home.html'"></div>
    </div>

    <script>
        function selectService(service) {
            alert(`✅ ${service} selected!`);
        }

        // Prevent scrolling
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('wheel', function(e) {
            e.preventDefault();
        }, { passive: false });

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
