<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCS eTMS</title>
    
    <!-- PWA Meta Tags (Added) -->
    <meta name="theme-color" content="#2C125B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" href="/manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
          
        }
        
        body {
            background: #2854b4;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        
        .phone-container {
            width: 410px;
            height: 800px;
            position: relative;
            border: 0;
            border-radius:0;
          
           
        }
        
        .phone-screen {
            width: 100%;
            height: 100%;
            background: #2854b4;
            position: relative;
        }
        
      .screenshot {
    position: absolute;
    inset: 0;
    background: url('exact.jpeg') no-repeat center center;
    background-size: cover;
}
  
        
        /* Bottom white bar */
     
        
        /* Clickable overlay buttons */
        .overlay-btn {
            position: absolute;
            border-radius: 50px;
            transition: all 0.15s ease;
            z-index: 3;
        }
        
        .overlay-btn:active {
            background: none;
        }
        
        .btn-bus {
            top: 25%;
            left: 10%;
            width: 89%;
            height: 86px;
        }
        
        .btn-cab {
            top: 40%;
            left: 10%;
            width: 89%;
            height: 86px;
        }
        
        .btn-geocode {
            top: 55%;
            left: 10%;
            width: 89%;
            height: 86px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="phone-screen">
            <!-- Top fill -->

            
            <!-- Screenshot -->
            <div class="screenshot"></div>
            
           
            
            <!-- Clickable Areas -->
            <div class="overlay-btn btn-bus" onclick="window.location.href='home.html'"></div>
            <div class="overlay-btn btn-cab" onclick="window.location.href='home.html'"></div>
            <div class="overlay-btn btn-geocode" onclick="window.location.href='home.html'"></div>
        </div>
    </div>

    <script>
        function selectService(service) {
            alert(`✅ ${service} selected!`);
        }

        // PWA Service Worker (Added)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
